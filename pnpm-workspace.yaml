packages:
  - apps/*
  - packages/*

# Transformers.js runs only in the browser here. Avoid its Node-only image and
# inference backends while retaining required platform binaries for Vite,
# Wrangler, Rolldown and esbuild.
ignoredOptionalDependencies:
  - onnxruntime-node
  - sharp

allowBuilds:
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  workerd: true

# SunDoge currently declares the pre-v5 Workers type package even though its
# D1 adapter only consumes the structurally compatible D1Database surface.
peerDependencyRules:
  allowedVersions:
    "@cloudflare/workers-types": ">=4"
